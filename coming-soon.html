<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ahweh Design | Coming Soon</title>
  <meta name="description" content="Vahweh Design — a new expression of elegance is coming soon. Timeless style, thoughtful design and refined boutique elegance.">
  <meta name="theme-color" content="#F7EED8">
  <link rel="icon" type="image/png" href="assets/images/Vahweh_Couture_Gold_Emblem.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- Decorative frame -->
  <div class="frame" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>

  <main class="page">
    <section class="hero container text-center" aria-labelledby="hero-title">
      <img class="logo reveal" style="--d:.1s"
           src="assets/images/Vahweh_Couture_Gold_Emblem.png"
           alt="Vahweh Design — luxury boutique logo"
           width="1455" height="1086" fetchpriority="high">

      <p class="eyebrow reveal" style="--d:.5s">Something Beautiful Is Coming</p>

      <h1 id="hero-title" class="headline reveal" style="--d:.8s">A New Expression <em>of Elegance.</em></h1>

      <div class="divider reveal" style="--d:1.1s" aria-hidden="true">
        <span class="line"></span><span class="diamond"></span><span class="line"></span>
      </div>

      <p class="lead-text reveal" style="--d:1.3s">
        Discover a world of timeless style, thoughtful design and refined elegance.
        Something special is being created for you.
      </p>

      <p class="badge-soon reveal" style="--d:1.5s">Coming Soon</p>
    </section>

    <footer class="site-footer text-center">
      <p>&copy; 2026 Vahweh Design. All Rights Reserved.</p>
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
